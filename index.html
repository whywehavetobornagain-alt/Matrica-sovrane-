<!DOCTYPE html>
<html>
<head>
<title>Matrica Sovrane</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="matrix-container">
<h1>Matrica Sovrane 🛡️</h1>
<p>Paneli i Agjentëve Autonomë</p>

<!-- Butoni i ri për vetë-aktivizimin e të 6 agjentëve menjëherë -->
<div style="text-align: center; margin-bottom: 20px;">
    <button onclick="autoActivateAll()" style="background: #00ffcc; color: #000; font-weight: bold; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">⚡ Auto-Aktivizo të 6 Agjentët</button>
</div>

<div class="agents-grid">
    <div class="agent-card">
        <h3>1. Vëzhguesi</h3>
        <button onclick="runAgent(1)">Aktivizo</button>
        <div class="output" id="out1">Në pritje...</div>
    </div>
    
    <div class="agent-card">
        <h3>2. Analizuesi</h3>
        <button onclick="runAgent(2)">Aktivizo</button>
        <div class="output" id="out2">Në pritje...</div>
    </div>

    <div class="agent-card">
        <h3>3. Ekzekutuesi</h3>
        <button onclick="runAgent(3)">Aktivizo</button>
        <div class="output" id="out3">Në pritje...</div>
    </div>

    <div class="agent-card">
        <h3>4. Strategu</h3>
        <button onclick="runAgent(4)">Aktivizo</button>
        <div class="output" id="out4">Në pritje...</div>
    </div>

    <div class="agent-card">
        <h3>5. Mbrojtësi</h3>
        <button onclick="runAgent(5)">Aktivizo</button>
        <div class="output" id="out5">Në pritje...</div>
    </div>

    <div class="agent-card">
        <h3>6. Komandanti</h3>
        <button onclick="runAgent(6)">Aktivizo</button>
        <div class="output" id="out6">Në pritje...</div>
    </div>
</div>

</div>
<script src="script.js"></script>
</body>
</html>
